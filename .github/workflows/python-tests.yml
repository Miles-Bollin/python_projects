name: Python Tests

on:
  push:
    branches:
      - main
      - feature/food-classification
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run:
          python -m pip install --upgrade pip
          python -m pip install -r food_Scanner/requirements.txt

      - name: Run classification tests
        run: python -m unittest -v test_prod_class.py

      - name: Check Python syntax
        run:
          python -m py_compile scanner_alpha.py
          python -m py_compile product_api.py
          python -m py_compile product_classification.py
